<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>来一个拥抱吧 🤗</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #ffe6e9 0%, #fff0f5 50%, #e6f0ff 100%);
      color: #333;
      overflow-x: hidden;
    }

    .container {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    h1 {
      font-size: clamp(2.8rem, 8vw, 5.5rem);
      font-weight: 800;
      color: #ff6b6b;
      text-shadow: 0 4px 10px rgba(255,107,107,0.3);
      margin-bottom: 0.2em;
      animation: float 6s ease-in-out infinite;
    }

    .hug-text {
      font-size: clamp(1.3rem, 5vw, 2.2rem);
      color: #555;
      text-align: center;
      max-width: 90%;
      line-height: 1.5;
      margin: 0.8em 0 1.5em;
    }

    .heart-emoji {
      font-size: 1.3em;
      animation: heartbeat 1.8s infinite;
    }

    .hug-btn {
      font-size: 1.4rem;
      padding: 16px 48px;
      background: #ff6b6b;
      color: white;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 8px 30px rgba(255,107,107,0.4);
      transition: all 0.3s;
      margin: 20px 0;
    }

    .hug-btn:hover {
      transform: translateY(-4px) scale(1.08);
      box-shadow: 0 12px 40px rgba(255,107,107,0.55);
      background: #ff8787;
    }

    .hug-btn:active {
      transform: translateY(0) scale(0.98);
    }

    .floating-hearts {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .heart {
      position: absolute;
      font-size: 2rem;
      color: #ff6b6b;
      opacity: 0;
      animation: floatUp linear forwards;
      user-select: none;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(100vh) scale(0.5);
        opacity: 0;
      }
      20% { opacity: 0.9; }
      100% {
        transform: translateY(-15vh) scale(1.2) rotate(360deg);
        opacity: 0;
      }
    }

    @keyframes float {
      0%,100% { transform: translateY(0); }
      50%     { transform: translateY(-15px); }
    }

    @keyframes heartbeat {
      0%,100%   { transform: scale(1); }
      50%       { transform: scale(1.3); }
    }

    @media (max-width: 480px) {
      .hug-btn { padding: 14px 40px; font-size: 1.3rem; }
    }
  </style>
</head>
<body>

  <h1>来一个拥抱吧</h1>

    <span class="heart-emoji">🤗</span>
  </div>

  <button class="hug-btn" onclick="sendHug()">抱一下！</button>

  <div class="floating-hearts" id="heartsContainer"></div>
</div>
